# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: pr-main-verify

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: dotnet test --no-build --settings Tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Check 80% coverage threshold
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/**/coverage.cobertura.xml | head -1)
          PERCENT=$(awk "BEGIN {print $COVERAGE * 100}")
          echo "Coverage: ${PERCENT}%"
          if (( $(awk "BEGIN {print ($PERCENT < 80)}") )); then
            echo "❌ Failed: ${PERCENT}% < 80%"
            exit 1
          fi
          echo "✅ Passed: ${PERCENT}% >= 80%"
